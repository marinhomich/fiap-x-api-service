server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fiap-x-api-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fiapx_db}
    username: ${DB_USER:fiapx_user}
    password: ${DB_PASSWORD:fiapx_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

storage:
  base-path: ${STORAGE_PATH:./storage_data}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours

rabbitmq:
  exchange:
    video: video.exchange
  queue:
    video-process: video.process.queue
    video-dlq: video.process.dlq
  routing-key:
    video-process: video.process.key
    video-dlq: video.process.dlq.key

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
