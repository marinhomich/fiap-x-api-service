spring:
  config:
    activate:
      on-profile: standalone

  datasource:
    url: jdbc:h2:file:./storage_data/fiapx_local_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

storage:
  base-path: ./storage_data

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000

rabbitmq:
  exchange:
    video: video.exchange
  queue:
    video-process: video.process.queue
    video-dlq: video.process.dlq
  routing-key:
    video-process: video.process.key
    video-dlq: video.process.dlq.key
